name: PersonalLibrary
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.9.0
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.8'
    CURRENT_PROJECT_VERSION: '13'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PersonalLibrary:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Enforce native UI generation
        inputFiles:
          - $(SRCROOT)/App/PersonalLibraryApp.swift
        script: |
          /usr/bin/grep -q 'NativeLibraryRoot()' "$SRCROOT/App/PersonalLibraryApp.swift" || { echo 'error: Only the native iPhone/iPad UI may be built.'; exit 1; }
          for old in App/CaptureView.swift App/LibraryReaderView.swift CaptureAssets/index.html CaptureAssets/writing/index.html; do
            test ! -e "$SRCROOT/$old" || { echo "error: Retired iOS UI must be removed: $old"; exit 1; }
          done
    sources:
      - App
      - Shared
      - path: ShareExtension
        excludes: [ShareViewController.swift]
      - Assets.xcassets
      - path: LearningVisuals
        type: folder
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COLLECTOR_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: Config/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - target: CollectorShare
        embed: true
      - sdk: libsqlite3.tbd
      - sdk: WebKit.framework
      - sdk: PDFKit.framework
  CollectorShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - App/NativeDesignSystem.swift
      - App/NativeComponents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COLLECTOR_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: libsqlite3.tbd
  PersonalLibraryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../../tests/fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COLLECTOR_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PersonalLibrary
schemes:
  PersonalLibrary:
    build:
      targets:
        PersonalLibrary: all
        CollectorShare: all
    test:
      targets:
        - PersonalLibraryTests
      gatherCoverageData: true
