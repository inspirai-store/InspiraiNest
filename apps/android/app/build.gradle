plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}
// Optional build-time default. Runtime pairing can select any validated origin.
def collectorServer = providers.gradleProperty('collectorServer').orElse('https://library.example.com').get()
def collectorUri = new URI(collectorServer)
if (collectorUri.scheme != 'https' || !collectorUri.host || collectorUri.rawUserInfo || collectorUri.rawQuery || collectorUri.rawFragment || !(collectorUri.path in ['', '/'])) {
    throw new GradleException('collectorServer must be an HTTPS origin')
}
android {
    namespace 'store.inspirai.library'
    compileSdk 36
    defaultConfig {
        applicationId 'store.inspirai.library'
        minSdk 26
        targetSdk 36
        versionCode 24
        buildConfigField 'String', 'DEFAULT_SERVER', '"' + collectorServer + '"'
        versionName '1.4.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets { androidTest.assets.srcDir(rootProject.file("../../tests/fixtures")); test.resources.srcDir(rootProject.file("../../collector/test/fixtures")); test.resources.srcDir(rootProject.file("../../tests/fixtures")) }
    testBuildType = providers.gradleProperty('androidTestBuildType').orElse('debug').get()
    buildFeatures { buildConfig true; compose true }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testJava = providers.gradleProperty('testJavaExecutable').orNull
            if (testJava) executable = testJava
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED', '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED', '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('LIBRARY_SIGNING_STORE')) {
                storeFile file(System.getenv('LIBRARY_SIGNING_STORE'))
                storePassword System.getenv('LIBRARY_SIGNING_PASSWORD')
                keyAlias 'personal-library'
                keyPassword System.getenv('LIBRARY_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.room:room-runtime:2.8.3'
    implementation 'androidx.room:room-ktx:2.8.3'
    kapt 'androidx.room:room-compiler:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.commonmark:commonmark:0.27.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.27.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation platform('androidx.compose:compose-bom:2025.10.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
}
kapt { arguments { arg('room.schemaLocation', "$projectDir/schemas") } }
tasks.register('verifyWritingAssets') {
    doLast {
        if (!file('src/main/assets/capture/writing/index.html').exists()) {
            throw new GradleException('Writing UI is missing. Run node collector/scripts/stage-writing.mjs from the repository root before building.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWritingAssets' }
