name: Collector builds
'on':
  workflow_dispatch:
    inputs:
      macos_only:
        description: Build and verify only the macOS Worker packages
        type: boolean
        default: false
      windows_only:
        description: Build and verify only the Windows 0.2 desktop package
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - collector/**
      - apps/**
      - packages/**
      - services/**
      - plugins/**
      - resources/**
      - tooling/**
      - infra/**
      - package.json
      - package-lock.json
      - assets/library.js
      - assets/library.css
      - assets/library-time.js
      - assets/client-prompt.*
      - assets/vendor/**
      - index.html
      - AGENTS.md
      - README.md
      - scripts/catalog.mjs
      - scripts/browser-data.mjs
      - scripts/write-collection-json.mjs
      - templates/**
      - .github/workflows/**
  pull_request:
    paths:
      - collector/**
      - apps/**
      - packages/**
      - services/**
      - plugins/**
      - resources/**
      - tooling/**
      - infra/**
      - package.json
      - package-lock.json
      - assets/**
      - index.html
      - scripts/write-collection-json.mjs
      - .github/workflows/**
permissions:
  contents: read
jobs:
  service-tests:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.macos_only) && !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/check-public-ci.mjs
        working-directory: collector
      - run: npm test
        working-directory: collector
      - name: Test mixed capture in Chrome
        run: node scripts/test-capture.cjs
        working-directory: collector
      - name: Test asynchronous processing center against isolated REST
        run: node scripts/test-processing-center.cjs
        working-directory: collector
      - name: Test isolated MySQL authorization and skills
        run: node scripts/test-auth-mysql.cjs
        working-directory: collector
      - name: Test SkillHub Web search
        run: node scripts/test-skill-market.cjs --web
        working-directory: collector
      - name: Test Web market installation and inventory
        working-directory: collector
        run: node scripts/test-skill-market-install.cjs --web
      - name: Test Web skill management
        run: node scripts/test-skills-web.cjs
        working-directory: collector
      - name: Test Web offline worker node removal
        run: node scripts/test-worker-nodes-ui.cjs
        working-directory: collector
      - name: Test Web node client updates and physical device grouping
        run: node scripts/test-client-updates-ui.cjs
        working-directory: collector
      - name: Test Web Agent management
        run: node scripts/test-agents-ui.cjs --web
        working-directory: collector
      - run: npm audit --omit=dev --audit-level=high
        working-directory: collector
    timeout-minutes: 30
  desktop-linux:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.macos_only) && !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npm ci --ignore-scripts && node node_modules/electron/install.js
      - name: Test shared React adapters
        run: node --experimental-strip-types --test scripts/*.test.mjs
        working-directory: apps/desktop/frontend
      - name: Build shared desktop UI
        run: npm run build:desktop-ui
        working-directory: collector
      - name: Test record conflict interaction against isolated REST in Electron
        run: xvfb-run -a node scripts/test-record-conflict.cjs
        working-directory: collector
    timeout-minutes: 20
  android:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.macos_only) && !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node collector/scripts/stage-writing.mjs && node collector/scripts/stage-capture.mjs
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
        working-directory: apps/android
      - name: Name Android package
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" apps/android/app/build.gradle | head -n 1)
          test -n "$version"
          mkdir -p collector/mobile/dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "collector/mobile/dist/InspiraiNest-v${version}-Android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: InspiraiNest-Android-debug
          path: collector/mobile/dist/InspiraiNest-v*-Android-debug.apk
          if-no-files-found: error
    timeout-minutes: 30
  worker-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.macos_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Parse Android signing PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('collector/mobile/scripts/build-release-android.ps1', 'tooling/android/configure-signing-ci.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors.Message -join "`n") }
          }
      - run: npm ci --ignore-scripts
      - name: Test shared React adapters and account isolation
        run: node --experimental-strip-types --test scripts/*.test.mjs
        working-directory: apps/desktop/frontend
      - name: Test Windows skill package and directory contracts
        run: node --test --test-reporter=tap test/skills.test.mjs test/content-management.test.mjs
        working-directory: collector
      - name: Test Windows native UTF-8 collection and upload recovery
        run: node --test --test-reporter=tap test/worker-encoding.test.mjs
        working-directory: collector
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: npm run build:worker:win
        working-directory: collector
      - name: Test download page
        run: node collector/scripts/test-download-ui.cjs
      - name: Verify Windows package, update hashes and preserved installer identity
        run: node collector/scripts/check-windows-package.mjs
      - name: Test packaged Windows React client against isolated REST services
        run: node collector/scripts/test-desktop-react.cjs artifacts/desktop/win-unpacked/InspiraiNest.exe
      - name: Test packaged record conflicts and manual merge
        run: node collector/scripts/test-records-packaged.cjs artifacts/desktop/win-unpacked/InspiraiNest.exe
      - name: Test packaged Windows planning conversation and owner bridge
        run: node collector/scripts/test-desktop-writing.cjs artifacts/desktop/win-unpacked/InspiraiNest.exe
      - name: Test packaged Windows update download
        shell: pwsh
        run: |
          $file = Get-Item artifacts/desktop/InspiraiNest-v*-Windows-x64.exe
          node collector/scripts/test-packaged-update.cjs artifacts/desktop/win-unpacked/InspiraiNest.exe $file.FullName
      - name: Test packaged Windows update window shutdown
        run: node collector/scripts/test-desktop-update-lifecycle.cjs artifacts/desktop/win-unpacked/InspiraiNest.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InspiraiNest-Windows-workbench-checks
          path: collector/test-output/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: InspiraiNest-Windows-x64
          path: |
            artifacts/desktop/InspiraiNest-v*-Windows-x64.exe
            artifacts/desktop/InspiraiNest-v*-Windows-x64.exe.blockmap
            artifacts/desktop/InspiraiNest-v*-Windows-x64.exe.sha256
            artifacts/desktop/*.yml
            artifacts/desktop/package-verification.json
          if-no-files-found: error
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    timeout-minutes: 30
  worker-macos:
    if: ${{ !inputs.windows_only }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Build macOS Worker for CI
        run: npm run build:worker:mac
        working-directory: collector
      - name: Check Worker packages
        shell: bash
        env:
          PUBLISH_MACOS: 'false'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for arch in arm64 x64; do
            zip="../artifacts/desktop/InspiraiNest-v${version}-macOS-${arch}.zip"
            dmg="../artifacts/desktop/InspiraiNest-v${version}-macOS-${arch}.dmg"
            app="../artifacts/desktop/$([[ "$arch" == arm64 ]] && echo mac-arm64 || echo mac)/灵藏.app"
            test -s "$zip"
            test -s "$dmg"
            unzip -tq "$zip" > /dev/null
            hdiutil verify "$dmg" > /dev/null
            codesign --verify --deep --strict "$app"
            node scripts/check-macos-name.mjs "$app"
            test "$(lipo -archs "$app/Contents/MacOS/灵藏")" = "$([[ "$arch" == arm64 ]] && echo arm64 || echo x86_64)"
            test -f "$app/Contents/Resources/library/scripts/catalog.mjs"
            if [[ "$PUBLISH_MACOS" == true ]]; then
              signature=$(codesign -dv --verbose=4 "$app" 2>&1)
              [[ "$signature" == *'Authority=Developer ID Application:'* ]]
              xcrun stapler validate "$app"
              spctl --assess --type execute "$app"
            fi
            entries=$(unzip -Z1 "$zip")
            if grep -Eq 'worker\.local\.json|admin-key\.txt|worker-data/' <<< "$entries"; then
              echo "Local configuration or runtime data was packaged: $zip" >&2
              exit 1
            fi
          done
          test "$(find ../artifacts/desktop -maxdepth 1 -name 'InspiraiNest-v*-macOS-*.zip' | wc -l | tr -d ' ')" = 2
          test "$(find ../artifacts/desktop -maxdepth 1 -name 'InspiraiNest-v*-macOS-*.dmg' | wc -l | tr -d ' ')" = 2
          feed=$(node -p "require('./package.json').version.includes('-beta.')?'beta-mac.yml':'latest-mac.yml'")
          test -s "../artifacts/desktop/$feed"
          grep -F "InspiraiNest-v${version}-macOS-arm64.zip" "../artifacts/desktop/$feed"
          grep -F "InspiraiNest-v${version}-macOS-x64.zip" "../artifacts/desktop/$feed"
          grep -F 'provider: generic' ../artifacts/desktop/mac/灵藏.app/Contents/Resources/app-update.yml
          grep -F 'https://library.inspirai.store/updates/macos' ../artifacts/desktop/mac/灵藏.app/Contents/Resources/app-update.yml
          (cd ../artifacts/desktop && shasum -a 256 "InspiraiNest-v${version}-macOS-arm64.zip" \
            "InspiraiNest-v${version}-macOS-x64.zip" "InspiraiNest-v${version}-macOS-arm64.dmg" \
            "InspiraiNest-v${version}-macOS-x64.dmg" > SHASUMS256.txt)
        working-directory: collector
      - name: Test packaged macOS update download
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$(uname -m)" == arm64 ]]; then
            arch=arm64
            app=../artifacts/desktop/mac-arm64/灵藏.app
          else
            arch=x64
            app=../artifacts/desktop/mac/灵藏.app
          fi
          node scripts/test-records-packaged.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-desktop-writing.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-desktop-update-lifecycle.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-packaged-update.cjs "$app/Contents/MacOS/灵藏" "../artifacts/desktop/InspiraiNest-v${version}-macOS-${arch}.zip"
        working-directory: collector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InspiraiNest-macOS-workbench-checks
          path: collector/test-output/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: InspiraiNest-macOS
          path: |
            artifacts/desktop/InspiraiNest-v*-macOS-*.zip
            artifacts/desktop/InspiraiNest-v*-macOS-*.dmg
            artifacts/desktop/InspiraiNest-v*-macOS-*.blockmap
            artifacts/desktop/SHASUMS256.txt
            artifacts/desktop/*-mac.yml
          if-no-files-found: error
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    timeout-minutes: 60
  worker-macos-intel:
    needs: worker-macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: InspiraiNest-macOS
          path: artifacts/desktop
      - name: Test x64 client from the shared macOS update artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          zip="../artifacts/desktop/InspiraiNest-v${version}-macOS-x64.zip"
          test -s "$zip"
          feed=$(node -p "require('./package.json').version.includes('-beta.')?'beta-mac.yml':'latest-mac.yml'")
          test -s "../artifacts/desktop/$feed"
          mkdir -p ../artifacts/desktop/intel-unpacked
          ditto -x -k "$zip" ../artifacts/desktop/intel-unpacked
          app=../artifacts/desktop/intel-unpacked/灵藏.app
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/灵藏")" = x86_64
          node scripts/test-packaged-update.cjs "$app/Contents/MacOS/灵藏" "$zip"
        working-directory: collector
    timeout-minutes: 20
  web-image:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.macos_only) && !inputs.windows_only }}
    runs-on: ubuntu-latest
    needs: service-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Prepare empty release directory
        run: mkdir -p collector/mobile/dist && touch collector/mobile/dist/.keep
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          load: true
          tags: personal-library-collector:ci
      - run: docker image inspect personal-library-collector:ci --format '{{.Id}}'
    timeout-minutes: 30

  agent-installation:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.macos_only) && !inputs.windows_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Test native directory and installation transactions
        run: node --test test/agent-management.test.mjs
        working-directory: collector
      - name: Install and verify five official Agents in an isolated home
        run: node scripts/test-agent-installation.mjs
        working-directory: collector
    timeout-minutes: 60

  android-share-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts
      - run: node collector/scripts/stage-writing.mjs && node collector/scripts/stage-capture.mjs
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/android
          script: bash ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=store.inspirai.library.NativeComposeFlowTest#continuousSharesReadNewContentAndKeepPreviousDraft,store.inspirai.library.NativeComposeFlowTest#shareAfterReturningClosesOldActivityAndOpensNewShare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-share-regression
          path: apps/android/app/build/reports/androidTests/
