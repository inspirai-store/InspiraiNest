name: Collector builds
'on':
  workflow_dispatch:
    inputs:
      macos_only:
        description: Build and verify only the macOS Worker packages
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - collector/**
      - assets/library.js
      - assets/library.css
      - assets/library-time.js
      - assets/client-prompt.*
      - assets/vendor/**
      - index.html
      - AGENTS.md
      - README.md
      - scripts/catalog.mjs
      - scripts/browser-data.mjs
      - templates/**
      - .github/workflows/collector-build.yml
  pull_request:
    paths:
      - collector/**
      - assets/**
      - index.html
      - .github/workflows/collector-build.yml
permissions:
  contents: read
jobs:
  service-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.macos_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: collector
      - run: node scripts/check-public-ci.mjs
        working-directory: collector
      - run: npm test
        working-directory: collector
      - name: Test isolated MySQL authorization and skills
        run: node scripts/test-auth-mysql.cjs
        working-directory: collector
      - name: Test SkillHub Web search
        run: node scripts/test-skill-market.cjs --web
        working-directory: collector
      - name: Test Web skill management
        run: node scripts/test-skills-web.cjs
        working-directory: collector
      - name: Test Web offline worker node removal
        run: node scripts/test-worker-nodes-ui.cjs
        working-directory: collector
      - run: npm audit --omit=dev --audit-level=high
        working-directory: collector
    timeout-minutes: 30
  desktop-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.macos_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npm ci --ignore-scripts && node node_modules/electron/install.js
        working-directory: collector
      - name: Test shared Linux desktop login
        run: xvfb-run -a node scripts/test-desktop-login.cjs
        working-directory: collector
      - name: Test SkillHub Linux desktop search
        run: xvfb-run -a node scripts/test-skill-market.cjs
        working-directory: collector
      - name: Test shared Linux skill management
        run: xvfb-run -a node scripts/test-desktop-skills.cjs
        working-directory: collector
      - name: Test shared Linux node actions during refresh
        run: xvfb-run -a node scripts/test-desktop-node-actions.cjs
        working-directory: collector
      - name: Test shared Linux update window shutdown
        run: xvfb-run -a node scripts/test-desktop-update-lifecycle.cjs
        working-directory: collector
    timeout-minutes: 20
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.macos_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
        working-directory: collector/mobile/android
      - name: Name Android package
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" collector/mobile/android/app/build.gradle | head -n 1)
          test -n "$version"
          mkdir -p collector/mobile/dist
          cp collector/mobile/android/app/build/outputs/apk/debug/app-debug.apk "collector/mobile/dist/InspiraiNest-v${version}-Android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: InspiraiNest-Android-debug
          path: collector/mobile/dist/InspiraiNest-v*-Android-debug.apk
          if-no-files-found: error
    timeout-minutes: 30
  worker-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.macos_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: collector
      - name: Test Windows skill package and directory contracts
        run: node --test --test-reporter=tap test/skills.test.mjs
        working-directory: collector
      - run: npm run build:worker:win
        working-directory: collector
      - name: Test download page
        run: node collector/scripts/test-download-ui.cjs
      - name: Check Worker package
        shell: pwsh
        run: |
          $file = Get-Item collector/desktop/dist/InspiraiNest-v*-Windows-x64.exe
          if ($file.Length -lt 1000000) { throw 'Worker package is unexpectedly small' }
          $metadata = Get-Content collector/desktop/dist/latest.yml -Raw
          if ($metadata -notmatch [regex]::Escape($file.Name) -or $metadata -notmatch 'sha512:') { throw 'Windows update metadata is missing the installer or checksum' }
          $feed = Get-Content collector/desktop/dist/win-unpacked/resources/app-update.yml -Raw
          if ($feed -notmatch 'provider: github' -or $feed -notmatch 'repo: InspiraiNest') { throw 'Windows update feed is missing' }
          (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -LiteralPath "$($file.FullName).sha256" -Encoding ascii
      - name: Test packaged Windows settings and nodes
        shell: pwsh
        run: node collector/scripts/test-desktop-settings-nodes.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test packaged Windows node actions during refresh
        shell: pwsh
        run: node collector/scripts/test-desktop-node-actions.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test packaged Windows password login
        shell: pwsh
        run: |
          node collector/scripts/test-desktop-login.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
          node collector/scripts/test-desktop-login-switch.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test SkillHub packaged Windows search
        shell: pwsh
        run: node collector/scripts/test-skill-market.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test packaged Windows skill management
        shell: pwsh
        run: node collector/scripts/test-desktop-skills.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test packaged Windows pairing layout
        shell: pwsh
        run: node collector/scripts/test-desktop-pairing.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test packaged Worker and reader
        shell: pwsh
        run: node collector/scripts/test-packaged-worker.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test packaged Worker logs
        shell: pwsh
        run: node collector/scripts/test-worker-logs-ui.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - name: Test packaged Windows update download
        shell: pwsh
        run: |
          $file = Get-Item collector/desktop/dist/InspiraiNest-v*-Windows-x64.exe
          node collector/scripts/test-packaged-update.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe $file.FullName
      - name: Test packaged Windows update window shutdown
        run: node collector/scripts/test-desktop-update-lifecycle.cjs collector/desktop/dist/win-unpacked/InspiraiNest.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InspiraiNest-Windows-workbench-checks
          path: collector/test-output/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: InspiraiNest-Windows-x64
          path: |
            collector/desktop/dist/InspiraiNest-v*-Windows-x64.exe
            collector/desktop/dist/InspiraiNest-v*-Windows-x64.exe.blockmap
            collector/desktop/dist/InspiraiNest-v*-Windows-x64.exe.sha256
            collector/desktop/dist/latest.yml
          if-no-files-found: error
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    timeout-minutes: 30
  worker-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: collector
      - name: Build macOS Worker for CI
        run: npm run build:worker:mac
        working-directory: collector
      - name: Check Worker packages
        shell: bash
        env:
          PUBLISH_MACOS: 'false'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for arch in arm64 x64; do
            zip="desktop/dist/InspiraiNest-v${version}-macOS-${arch}.zip"
            dmg="desktop/dist/InspiraiNest-v${version}-macOS-${arch}.dmg"
            app="desktop/dist/$([[ "$arch" == arm64 ]] && echo mac-arm64 || echo mac)/灵藏.app"
            test -s "$zip"
            test -s "$dmg"
            unzip -tq "$zip" > /dev/null
            hdiutil verify "$dmg" > /dev/null
            codesign --verify --deep --strict "$app"
            node scripts/check-macos-name.mjs "$app"
            test "$(lipo -archs "$app/Contents/MacOS/灵藏")" = "$([[ "$arch" == arm64 ]] && echo arm64 || echo x86_64)"
            test -f "$app/Contents/Resources/library/scripts/catalog.mjs"
            if [[ "$PUBLISH_MACOS" == true ]]; then
              signature=$(codesign -dv --verbose=4 "$app" 2>&1)
              [[ "$signature" == *'Authority=Developer ID Application:'* ]]
              xcrun stapler validate "$app"
              spctl --assess --type execute "$app"
            fi
            entries=$(unzip -Z1 "$zip")
            if grep -Eq 'worker\.local\.json|admin-key\.txt|worker-data/' <<< "$entries"; then
              echo "Local configuration or runtime data was packaged: $zip" >&2
              exit 1
            fi
          done
          test "$(find desktop/dist -maxdepth 1 -name 'InspiraiNest-v*-macOS-*.zip' | wc -l | tr -d ' ')" = 2
          test "$(find desktop/dist -maxdepth 1 -name 'InspiraiNest-v*-macOS-*.dmg' | wc -l | tr -d ' ')" = 2
          test -s desktop/dist/latest-mac.yml
          grep -F "InspiraiNest-v${version}-macOS-arm64.zip" desktop/dist/latest-mac.yml
          grep -F "InspiraiNest-v${version}-macOS-x64.zip" desktop/dist/latest-mac.yml
          grep -F 'provider: generic' desktop/dist/mac/灵藏.app/Contents/Resources/app-update.yml
          grep -F 'https://library.inspirai.store/updates/macos' desktop/dist/mac/灵藏.app/Contents/Resources/app-update.yml
          (cd desktop/dist && shasum -a 256 "InspiraiNest-v${version}-macOS-arm64.zip" \
            "InspiraiNest-v${version}-macOS-x64.zip" "InspiraiNest-v${version}-macOS-arm64.dmg" \
            "InspiraiNest-v${version}-macOS-x64.dmg" > SHASUMS256.txt)
        working-directory: collector
      - name: Test packaged macOS update download
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$(uname -m)" == arm64 ]]; then
            arch=arm64
            app=desktop/dist/mac-arm64/灵藏.app
          else
            arch=x64
            app=desktop/dist/mac/灵藏.app
          fi
          node scripts/test-desktop-settings-nodes.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-desktop-node-actions.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-skill-market.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-desktop-skills.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-desktop-login.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-desktop-login-switch.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-desktop-pairing.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-packaged-worker.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-worker-logs-ui.cjs "$app/Contents/MacOS/灵藏"
          node scripts/test-packaged-update.cjs "$app/Contents/MacOS/灵藏" "desktop/dist/InspiraiNest-v${version}-macOS-${arch}.zip"
        working-directory: collector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InspiraiNest-macOS-workbench-checks
          path: collector/test-output/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: InspiraiNest-macOS
          path: |
            collector/desktop/dist/InspiraiNest-v*-macOS-*.zip
            collector/desktop/dist/InspiraiNest-v*-macOS-*.dmg
            collector/desktop/dist/InspiraiNest-v*-macOS-*.blockmap
            collector/desktop/dist/SHASUMS256.txt
            collector/desktop/dist/latest-mac.yml
          if-no-files-found: error
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    timeout-minutes: 60
  worker-macos-intel:
    needs: worker-macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: collector
      - uses: actions/download-artifact@v4
        with:
          name: InspiraiNest-macOS
          path: collector/desktop/dist
      - name: Test x64 client from the shared macOS update artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          zip="desktop/dist/InspiraiNest-v${version}-macOS-x64.zip"
          test -s "$zip"
          test -s desktop/dist/latest-mac.yml
          mkdir -p desktop/dist/intel-unpacked
          ditto -x -k "$zip" desktop/dist/intel-unpacked
          app=desktop/dist/intel-unpacked/灵藏.app
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/灵藏")" = x86_64
          node scripts/test-packaged-update.cjs "$app/Contents/MacOS/灵藏" "$zip"
        working-directory: collector
    timeout-minutes: 20
  web-image:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.macos_only }}
    runs-on: ubuntu-latest
    needs: service-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Prepare empty release directory
        run: mkdir -p collector/mobile/dist && touch collector/mobile/dist/.keep
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: collector/Dockerfile
          push: false
          load: true
          tags: personal-library-collector:ci
      - run: docker image inspect personal-library-collector:ci --format '{{.Id}}'
    timeout-minutes: 30
