name: InspiraiNest signed client OSS release

# Manual releases use the reviewed main commit and retain verified packages in OSS.

on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: Build signed and notarized macOS packages
        type: boolean
        default: true
      publish_macos:
        description: Publish macOS update files to OSS; disable for local installation only
        type: boolean
        default: true
      include_android:
        description: Build Android using the existing release signing identity
        type: boolean
        default: false
      include_windows_ci:
        description: Relay a verified Windows CI artifact to private OSS
        type: boolean
        default: false
      windows_ci_run:
        description: Successful main-branch Collector builds run ID
        type: string
        default: ''
      windows_source_commit:
        description: Exact Windows CI source commit
        type: string
        default: ''
      inspect_macos_workspace:
        description: Retain isolated macOS QA diagnostics without rebuilding or publishing
        type: boolean
        default: false
      macos_source_commit:
        description: Exact source of the retained macOS workspace
        type: string
        default: ''
      macos_source_run:
        description: Original run that built and verified the retained signed packages
        type: string
        default: ''
      verify_macos_workspace:
        description: Recheck retained signed packages, run native QA and publish unchanged bytes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-diagnostics:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SIGNED_RELEASE == 'true' && (inputs.inspect_macos_workspace || inputs.verify_macos_workspace)
    environment: signed-release
    runs-on: [self-hosted, macOS, ARM64, inspirainest-macos]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
      group: inspirainest-macos-release
      cancel-in-progress: false
    steps:
      - name: Check out only the reviewed QA launcher separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa-tools
          persist-credentials: false
          sparse-checkout: collector/scripts/run-macos-gui-qa.cjs
          sparse-checkout-cone-mode: false
      - name: Validate retained workspace source
        env:
          EXPECTED_SOURCE: ${{ inputs.macos_source_commit }}
          VERIFY_PACKAGES: ${{ inputs.verify_macos_workspace }}
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C public-source rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git -C public-source status --short --untracked-files=no
          if [[ "$VERIFY_PACKAGES" == true ]]; then
            # Desktop packaging regenerates these mobile icons from the shared brand asset.
            # All executable source, tests and release configuration must remain unchanged.
            test -z "$(git -C public-source status --porcelain --untracked-files=no -- . ':!collector/mobile/android/app/src/main/res/drawable-nodpi/ic_inspiration_nook.png' ':!collector/mobile/ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png')"
          fi
          test -f public-source/collector/test-output/react-desktop/progress.json
      - name: Inspect keychain availability without reading credentials
        run: |
          id
          stat -f 'Console user: %Su' /dev/console
          launchctl print "gui/$(id -u)" >/dev/null && echo 'GUI bootstrap available' || true
          parent=$$
          for depth in 1 2 3 4; do
            ps -p "$parent" -o pid=,ppid=,uid=,comm=
            parent=$(ps -p "$parent" -o ppid= | tr -d ' ')
          done
          security default-keychain -d user || true
          security list-keychains -d user
          security show-keychain-info "$HOME/Library/Keychains/login.keychain-db" || true
      - name: Probe native safeStorage in the runner and GUI bootstrap
        if: ${{ inputs.inspect_macos_workspace }}
        working-directory: public-source/collector
        run: |
          probe="$RUNNER_TEMP/inspirainest-native-keychain-probe.cjs"
          cat > "$probe" <<'JS'
          const { _electron } = require(process.env.SOURCE_COLLECTOR + '/node_modules/playwright');
          const fs = require('node:fs'), os = require('node:os'), path = require('node:path');
          (async () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'inspirainest-keychain-probe-'));
            const config = path.join(root, 'worker.json');
            fs.writeFileSync(config, JSON.stringify({dataDir:path.join(root,'data')}));
            const env = {...process.env, COLLECTOR_CONFIG:config, COLLECTOR_DESKTOP_TEST:'1'};
            delete env.ELECTRON_RUN_AS_NODE; delete env.COLLECTOR_DESKTOP_STORAGE_FIXTURE;
            const app = await _electron.launch({executablePath:path.resolve('desktop/dist/mac-arm64/灵藏.app/Contents/MacOS/灵藏'),env});
            try {
              await app.firstWindow();
              const result = await app.evaluate(({safeStorage}) => {
                const available = safeStorage.isEncryptionAvailable();
                return {available, roundTrip:available && safeStorage.decryptString(safeStorage.encryptString('disposable-ci-check')) === 'disposable-ci-check'};
              });
              console.log(JSON.stringify({context:process.env.PROBE_CONTEXT,...result}));
            } finally { await app.close(); fs.rmSync(root,{recursive:true,force:true}); }
          })().catch(error => {console.error(error.message);process.exitCode=1;});
          JS
          export SOURCE_COLLECTOR="$PWD"
          PROBE_CONTEXT=runner node "$probe"
          PROBE_CONTEXT=gui node "$GITHUB_WORKSPACE/qa-tools/collector/scripts/run-macos-gui-qa.cjs" "$probe"
      - name: Verify original source run and unchanged signed packages
        if: ${{ inputs.verify_macos_workspace }}
        working-directory: public-source/collector
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.macos_source_run }}
          EXPECTED_SOURCE: ${{ inputs.macos_source_commit }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';
          assert.match(process.env.SOURCE_RUN,/^[0-9]+$/);
          const api=route=>{const r=spawnSync('gh',['api',route],{encoding:'utf8'});assert.equal(r.status,0);return JSON.parse(r.stdout);};
          const base=`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.SOURCE_RUN}`,run=api(base);
          assert.equal(run.head_sha,process.env.EXPECTED_SOURCE);assert.equal(run.head_branch,'main');assert.equal(run.path,'.github/workflows/collector-release.yml');assert.equal(run.head_repository.full_name,process.env.GITHUB_REPOSITORY);
          const job=api(base+'/jobs').jobs.find(job=>job.name==='signed-macos');assert.ok(job);
          for(const name of ['Test React desktop adapters and state','Run node --test --test-concurrency=4 test/*.test.mjs','Build Developer ID signed and notarized macOS packages','Verify signatures, both architectures and update metadata'])assert.equal(job.steps.find(step=>step.name===name)?.conclusion,'success',name);
          JS
          (cd desktop/dist && shasum -a 256 -c SHASUMS256.txt)
          for arch in arm64 x64; do
            app="desktop/dist/$([[ "$arch" == arm64 ]] && echo mac-arm64 || echo mac)/灵藏.app"
            codesign --verify --deep --strict "$app"
            test "$(lipo -archs "$app/Contents/MacOS/灵藏")" = "$([[ "$arch" == arm64 ]] && echo arm64 || echo x86_64)"
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
          done
      - name: Retest retained macOS native login, records and conflicts
        if: ${{ inputs.verify_macos_workspace }}
        working-directory: public-source/collector
        run: |
          node "$GITHUB_WORKSPACE/qa-tools/collector/scripts/run-macos-gui-qa.cjs" scripts/test-records-packaged.cjs desktop/dist/mac-arm64/灵藏.app/Contents/MacOS/灵藏
          version=$(node -p "require('./package.json').version")
          node "$GITHUB_WORKSPACE/qa-tools/collector/scripts/run-macos-gui-qa.cjs" scripts/test-packaged-update.cjs desktop/dist/mac-arm64/灵藏.app/Contents/MacOS/灵藏 "desktop/dist/InspiraiNest-v${version}-macOS-arm64.zip"
          node "$GITHUB_WORKSPACE/qa-tools/collector/scripts/run-macos-gui-qa.cjs" scripts/test-desktop-update-lifecycle.cjs desktop/dist/mac-arm64/灵藏.app/Contents/MacOS/灵藏
      - name: Publish unchanged retained macOS packages after native QA
        if: ${{ inputs.verify_macos_workspace }}
        working-directory: public-source/collector
        env:
          OSS_RELEASE_REGION: ${{ secrets.OSS_RELEASE_REGION }}
          OSS_RELEASE_BUCKET: ${{ secrets.OSS_RELEASE_BUCKET }}
          OSS_RELEASE_ACCESS_KEY_ID: ${{ secrets.OSS_RELEASE_ACCESS_KEY_ID }}
          OSS_RELEASE_ACCESS_KEY_SECRET: ${{ secrets.OSS_RELEASE_ACCESS_KEY_SECRET }}
          OSS_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          OSS_RELEASE_SOURCE_COMMIT: ${{ inputs.macos_source_commit }}
        run: |
          (cd desktop/dist && shasum -a 256 -c SHASUMS256.txt)
          node scripts/upload-macos-oss.mjs desktop/dist InspiraiNest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InspiraiNest-macOS-retained-QA
          path: public-source/collector/test-output/react-desktop/
          if-no-files-found: error
  windows-ci-oss:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SIGNED_RELEASE == 'true' && inputs.include_windows_ci
    environment: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the trusted CI source before downloading or exposing OSS credentials
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_CI_RUN: ${{ inputs.windows_ci_run }}
          WINDOWS_SOURCE_COMMIT: ${{ inputs.windows_source_commit }}
        run: node collector/scripts/upload-windows-ci-oss.mjs validate
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_ci_run }}
          name: InspiraiNest-Windows-x64
          path: collector/desktop/dist
      - run: npm ci --ignore-scripts
        working-directory: collector
      - name: Verify and relay the unchanged Windows CI files
        working-directory: collector
        env:
          OSS_RELEASE_REGION: ${{ secrets.OSS_RELEASE_REGION }}
          OSS_RELEASE_BUCKET: ${{ secrets.OSS_RELEASE_BUCKET }}
          OSS_RELEASE_ACCESS_KEY_ID: ${{ secrets.OSS_RELEASE_ACCESS_KEY_ID }}
          OSS_RELEASE_ACCESS_KEY_SECRET: ${{ secrets.OSS_RELEASE_ACCESS_KEY_SECRET }}
          OSS_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/upload-windows-ci-oss.mjs upload
  signed-macos:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SIGNED_RELEASE == 'true' && inputs.include_macos
    environment: signed-release
    runs-on: [self-hosted, macOS, ARM64, inspirainest-macos]
    timeout-minutes: 150
    concurrency:
      group: inspirainest-macos-release
      cancel-in-progress: false
    steps:
      - name: Check out the reviewed public source commit
        uses: actions/checkout@v4
        with:
          repository: inspirai-store/InspiraiNest
          ref: ${{ github.sha }}
          path: public-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the source pin before any secrets are available
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-source rev-parse HEAD)" = ${{ github.sha }}
          node -e 'if(!/^\d+\.\d+\.\d+$/.test(require("./public-source/collector/package.json").version))throw Error("Invalid release version")'
          test -f public-source/collector/desktop/updater.mjs
          test -f public-source/collector/desktop/macos-policy.mjs
          test -f public-source/collector/electron-builder.yml
      - run: npm ci --ignore-scripts
        working-directory: public-source/collector
      - run: npm ci --ignore-scripts
        working-directory: public-source/collector/desktop/frontend
      - name: Test React desktop adapters and state
        working-directory: public-source/collector/desktop/frontend
        run: node --experimental-strip-types --test scripts/*.test.mjs
      # Keep the self-hosted runner's timing-sensitive Worker fixtures within
      # their deadlines while still executing the complete test suite.
      - run: node --test --test-concurrency=4 test/*.test.mjs
        working-directory: public-source/collector
      - name: Build Developer ID signed and notarized macOS packages
        working-directory: public-source/collector
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing $name" >&2; exit 1; }
          done
          npm run build:worker:mac:release
      - name: Verify signatures, both architectures and update metadata
        working-directory: public-source/collector
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test -s desktop/dist/latest-mac.yml
          for arch in arm64 x64; do
            zip="desktop/dist/InspiraiNest-v${version}-macOS-${arch}.zip"
            dmg="desktop/dist/InspiraiNest-v${version}-macOS-${arch}.dmg"
            app="desktop/dist/$([[ "$arch" == arm64 ]] && echo mac-arm64 || echo mac)/灵藏.app"
            test -s "$zip"
            test -s "$dmg"
            unzip -tq "$zip" >/dev/null
            hdiutil verify "$dmg" >/dev/null
            codesign --verify --deep --strict "$app"
            node scripts/check-macos-name.mjs "$app"
            test "$(lipo -archs "$app/Contents/MacOS/灵藏")" = "$([[ "$arch" == arm64 ]] && echo arm64 || echo x86_64)"
            signature=$(codesign -dv --verbose=4 "$app" 2>&1)
            [[ "$signature" == *'Authority=Developer ID Application:'* ]]
            [[ "$signature" == *"TeamIdentifier=$APPLE_TEAM_ID"* ]]
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
            grep -F "InspiraiNest-v${version}-macOS-${arch}.zip" desktop/dist/latest-mac.yml
          done
          grep -F 'provider: generic' desktop/dist/mac/灵藏.app/Contents/Resources/app-update.yml
          grep -F 'https://library.inspirai.store/updates/macos' desktop/dist/mac/灵藏.app/Contents/Resources/app-update.yml
          node -e 'const fs=require("fs"),crypto=require("crypto"),yaml=require("js-yaml");const manifest=yaml.load(fs.readFileSync("desktop/dist/latest-mac.yml","utf8"));if(manifest.version!==require("./package.json").version)throw Error("Version mismatch");for(const arch of ["arm64","x64"]){const name=`InspiraiNest-v${manifest.version}-macOS-${arch}.zip`;const entry=manifest.files.find(file=>file.url===name);if(!entry)throw Error(`Missing ${name} in update manifest`);const bytes=fs.readFileSync(`desktop/dist/${name}`);if(bytes.length!==entry.size||crypto.createHash("sha512").update(bytes).digest("base64")!==entry.sha512)throw Error(`Manifest checksum mismatch: ${name}`)}'
          (cd desktop/dist && shasum -a 256 "InspiraiNest-v${version}-macOS-arm64.zip" \
            "InspiraiNest-v${version}-macOS-x64.zip" "InspiraiNest-v${version}-macOS-arm64.dmg" \
            "InspiraiNest-v${version}-macOS-x64.dmg" > SHASUMS256.txt)
      - name: Test signed macOS React records, login and safe conflicts
        if: ${{ inputs.publish_macos }}
        working-directory: public-source/collector
        run: node scripts/test-records-packaged.cjs desktop/dist/mac-arm64/灵藏.app/Contents/MacOS/灵藏
      - name: Test signed Apple Silicon update download
        if: ${{ inputs.publish_macos }}
        working-directory: public-source/collector
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/test-packaged-update.cjs \
            desktop/dist/mac-arm64/灵藏.app/Contents/MacOS/灵藏 \
            "desktop/dist/InspiraiNest-v${version}-macOS-arm64.zip"
      - name: Test signed macOS update window shutdown
        if: ${{ inputs.publish_macos }}
        working-directory: public-source/collector
        run: node scripts/test-desktop-update-lifecycle.cjs desktop/dist/mac-arm64/灵藏.app/Contents/MacOS/灵藏
      - name: Retain signed packages for local installation
        if: ${{ !inputs.publish_macos }}
        uses: actions/upload-artifact@v4
        with:
          name: InspiraiNest-macOS-local-${{ github.run_id }}
          path: |
            public-source/collector/desktop/dist/InspiraiNest-v*-macOS-*.zip
            public-source/collector/desktop/dist/InspiraiNest-v*-macOS-*.dmg
            public-source/collector/desktop/dist/InspiraiNest-v*-macOS-*.zip.blockmap
            public-source/collector/desktop/dist/latest-mac.yml
            public-source/collector/desktop/dist/SHASUMS256.txt
          if-no-files-found: error
      - name: Upload verified packages and update files to private OSS
        if: ${{ inputs.publish_macos }}
        working-directory: public-source/collector
        shell: bash
        env:
          OSS_RELEASE_REGION: ${{ secrets.OSS_RELEASE_REGION }}
          OSS_RELEASE_BUCKET: ${{ secrets.OSS_RELEASE_BUCKET }}
          OSS_RELEASE_ACCESS_KEY_ID: ${{ secrets.OSS_RELEASE_ACCESS_KEY_ID }}
          OSS_RELEASE_ACCESS_KEY_SECRET: ${{ secrets.OSS_RELEASE_ACCESS_KEY_SECRET }}
          OSS_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          OSS_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/upload-macos-oss.mjs desktop/dist InspiraiNest

  signed-android:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SIGNED_RELEASE == 'true' && inputs.include_android
    environment: signed-release
    runs-on: [self-hosted, macOS, ARM64, inspirainest-macos]
    timeout-minutes: 45
    concurrency:
      group: inspirainest-android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: inspirai-store/InspiraiNest
          ref: ${{ github.sha }}
          path: public-source
          persist-credentials: false
      - name: Check reviewed source pin
        run: test "$(git -C public-source rev-parse HEAD)" = ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --ignore-scripts
        working-directory: public-source/collector
      - name: Build and verify the existing Android signing identity
        working-directory: public-source/collector/mobile/android
        shell: bash
        env:
          ANDROID_SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
          LIBRARY_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          LIBRARY_SIGNING_STORE: ${{ runner.temp }}/inspirainest-android-release.p12
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_STORE" || { echo 'Missing ANDROID_SIGNING_STORE' >&2; exit 1; }
          test -n "$LIBRARY_SIGNING_PASSWORD" || { echo 'Missing ANDROID_SIGNING_PASSWORD' >&2; exit 1; }
          node -e 'const fs=require("fs");fs.writeFileSync(process.env.LIBRARY_SIGNING_STORE,Buffer.from(process.env.ANDROID_SIGNING_STORE,"base64"),{mode:0o600})'
          bash ./gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          node "$GITHUB_WORKSPACE/public-source/.github/scripts/stage-android-release.mjs"
      - name: Upload verified Android package to private OSS
        working-directory: public-source/collector
        env:
          OSS_RELEASE_REGION: ${{ secrets.OSS_RELEASE_REGION }}
          OSS_RELEASE_BUCKET: ${{ secrets.OSS_RELEASE_BUCKET }}
          OSS_RELEASE_ACCESS_KEY_ID: ${{ secrets.OSS_RELEASE_ACCESS_KEY_ID }}
          OSS_RELEASE_ACCESS_KEY_SECRET: ${{ secrets.OSS_RELEASE_ACCESS_KEY_SECRET }}
          OSS_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          OSS_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: node ../.github/scripts/upload-android-oss.mjs mobile/dist
      - name: Remove temporary Android signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/inspirainest-android-release.p12"
