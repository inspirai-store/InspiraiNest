name: Plugin workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:all
      - run: npm run build:native-assets
      - name: Test embedded writing with the native bridge
        run: node collector/scripts/qa-writing.mjs
      - name: Test plugin lifecycle and settings routes in the browser
        run: node tooling/plugins/browser-qa.mjs
      - name: Test conversational blocks planning in the browser
        run: node tooling/plugins/blocks-browser-qa.mjs
      - name: Test library cards and canvas with existing REST archives
        run: node tooling/library-canvas-browser-qa.mjs
      - run: npm test
      - run: node scripts/catalog.mjs build && node scripts/catalog.mjs check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci --ignore-scripts && npm run build:native-assets
      - run: bash apps/android/gradlew -p apps/android --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts && npm run build:native-assets
      - run: brew install xcodegen
      - run: cp apps/ios/Config/Local.xcconfig.example apps/ios/Config/Local.xcconfig && xcodegen generate --spec apps/ios/project.yml
      - run: npm run check:ios-ui
      - run: python3 apps/ios/scripts/check_contract.py
      - name: Test app and share extension
        run: |
          IFS=$'\t' read -r destination webkitLibrary < <(xcrun simctl list -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const data=JSON.parse(s);for(const [runtime,devices] of Object.entries(data.devices)){const device=devices.find(d=>d.isAvailable&&d.name.startsWith("iPhone"));if(device){const r=data.runtimes.find(r=>r.identifier===runtime);console.log(device.udid+"\t"+r.bundlePath+"/Contents/Resources/RuntimeRoot/System/Cryptexes/OS/usr/lib/swift/libswiftWebKit.dylib");return}}process.exit(1)})')
          options=(-project apps/ios/PersonalLibrary.xcodeproj -scheme PersonalLibrary -destination "platform=iOS Simulator,id=$destination" -derivedDataPath artifacts/ios CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- COLLECTOR_BUNDLE_ID=com.inspirai.devices.unit COLLECTOR_APP_GROUP=group.com.inspirai.devices.unit COLLECTOR_KEYCHAIN_SUFFIX=com.inspirai.devices.unit)
          xcodebuild "${options[@]}" build-for-testing
          # iOS 18.5 moved the WebKit overlay without its compatibility link.
          # Use the runtime's own library in the test host's search directory.
          # https://bugs.webkit.org/show_bug.cgi?id=293831
          if [ -f "$webkitLibrary" ]; then
            ln -sf "$webkitLibrary" artifacts/ios/Build/Products/Debug-iphonesimulator/libswiftWebKit.dylib
          fi
          xcodebuild "${options[@]}" test-without-building

      - name: Reject retired iPhone/iPad artifacts
        run: python3 tooling/releases/check-ios-artifact.py artifacts/ios/Build/Products/Debug-iphonesimulator/PersonalLibrary.app
