name: Synchronize desktop release and public downloads
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit public release or add missing GitHub assets from exact official bytes
        type: choice
        options: [audit, reconcile]
        default: audit
  workflow_call:
    inputs:
      source_run:
        type: string
        required: true
      include_windows:
        type: boolean
        default: true
      include_macos:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  synchronize:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.ENABLE_SIGNED_RELEASE == 'true'
    environment: signed-release
    runs-on: [self-hosted, macOS, ARM64, inspirainest-macos]
    timeout-minutes: 50
    concurrency:
      group: inspirainest-desktop-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Reserve an isolated publication directory
        shell: bash
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/desktop-publication.XXXXXXXX")
          echo "PUBLICATION_WORK=$work" >> "$GITHUB_ENV"
          echo "PUBLICATION_INPUT=$work/input" >> "$GITHUB_ENV"
      - name: Download the verified Windows publication input
        if: inputs.source_run != '' && inputs.include_windows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: desktop-publication-windows
          path: ${{ env.PUBLICATION_INPUT }}/windows
      - name: Download the signed and notarized macOS publication input
        if: inputs.source_run != '' && inputs.include_macos
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: desktop-publication-macos
          path: ${{ env.PUBLICATION_INPUT }}/macos
      - name: Verify, synchronize and read back the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SOURCE_RUN: ${{ inputs.source_run }}
          PUBLISH_WINDOWS: ${{ inputs.include_windows }}
          PUBLISH_MACOS: ${{ inputs.include_macos }}
          PUBLICATION_MODE: ${{ inputs.mode }}
          MACOS_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PUBLICATION_SOURCE_RUN" ]]; then
            node tooling/releases/run-desktop-publication.mjs publish
          else
            node tooling/releases/run-desktop-publication.mjs "$PUBLICATION_MODE"
          fi
      - name: Retain only public release verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-publication-receipts
          path: |
            ${{ env.PUBLICATION_WORK }}/publication-receipt.json
            ${{ env.PUBLICATION_WORK }}/public-verification.json
            ${{ env.PUBLICATION_WORK }}/deployment-receipt.json
          if-no-files-found: ignore
