<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>InspiraiNest</title><link rel="stylesheet" href="mobile.css"><script defer src="vendor/marked.js"></script><script defer src="vendor/purify.js"></script><script defer src="vendor/lucide.js"></script><script defer src="mobile.js"></script></head><body>
<main id="library">
 <header class="masthead"><div><span class="eyebrow">InspiraiNest</span><h1>资料库<span class="brand-dot"></span></h1></div><div><button class="icon" id="refresh" aria-label="刷新资料"><i data-lucide="refresh-cw"></i></button><a class="icon" href="nook://new" aria-label="新建采集"><i data-lucide="plus"></i></a></div></header>
 <label class="search"><i data-lucide="search"></i><input id="query" type="search" placeholder="搜索标题、标签或正文" aria-label="搜索资料"><button id="clear" class="icon" aria-label="清空搜索" hidden><i data-lucide="x"></i></button></label>
 <div class="tools"><div class="segments"><button id="all" aria-pressed="true">全部</button><button id="favorites" aria-pressed="false"><img class="brand-icon" src="icons/bookmark.png" alt="">收藏</button></div><button id="filter" class="text-button"><i data-lucide="sliders-horizontal"></i>筛选<span id="filter-dot" hidden>·</span></button></div>
 <div class="caption"><span id="result-count">正在载入资料</span><span id="sort-label">最近收集</span></div>
 <div id="message" role="status" hidden></div><section id="results" aria-label="资料列表"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
</main>
<section id="reader" hidden>
 <header class="reader-bar"><button class="icon" id="back" aria-label="返回资料库"><i data-lucide="arrow-left"></i></button><span id="reader-kind"></span><div><button class="icon" id="save" aria-label="收藏资料"><i data-lucide="bookmark"></i></button><button class="icon" id="more" aria-label="更多操作"><i data-lucide="ellipsis"></i></button></div></header>
 <div class="reader-heading"><div class="eyebrow" id="reader-status"></div><h1 id="reader-title"></h1><p class="byline" id="reader-meta"></p></div>
 <nav id="document-tabs" aria-label="资料内容"></nav><div id="document-picker"></div><article id="document" class="prose"></article>
 <footer class="reader-footer"><button id="attachments" class="text-button"><i data-lucide="paperclip"></i>附件与来源详情<i data-lucide="chevron-right"></i></button></footer>
</section>
<section id="details" hidden><header class="reader-bar"><button id="details-back" class="icon" aria-label="返回正文"><i data-lucide="arrow-left"></i></button><strong>附件与来源</strong></header><div class="detail-body"><h2 id="detail-title"></h2><p id="coverage"></p><a id="source" class="row-link" target="_blank" rel="noopener">打开原始来源<i data-lucide="arrow-up-right"></i></a><div id="files"></div><div id="omitted"></div></div></section>
<section id="image-view" hidden><header class="reader-bar"><button id="image-back" class="icon" aria-label="返回附件"><i data-lucide="arrow-left"></i></button><span>图片预览</span></header><img id="full-image" alt="资料图片"><a id="image-original" class="text-button">保存图片</a></section>
<dialog id="filters"><form method="dialog"><div class="sheet-title"><h2>筛选资料</h2><button class="icon" aria-label="关闭筛选"><i data-lucide="x"></i></button></div><label>资料类型<select id="type"><option value="all">全部类型</option></select></label><label>主题标签<select id="tag"><option value="">全部主题</option></select></label><label>归档状态<select id="status"><option value="all">全部状态</option><option value="archived">已归档</option><option value="partial">待补齐</option><option value="pending">待处理</option></select></label><label>排序<select id="sort"><option value="newest">最近收集</option><option value="oldest">最早收集</option><option value="title">标题顺序</option></select></label><div class="sheet-actions"><button type="button" id="reset">重置</button><button class="primary" id="apply">应用筛选</button></div></form></dialog>
<dialog id="menu"><div class="sheet-title"><h2>阅读选项</h2><button id="close-menu" class="icon" aria-label="关闭菜单"><i data-lucide="x"></i></button></div><button id="theme" class="row-link">外观：跟随系统<i data-lucide="moon"></i></button><button id="open-details" class="row-link">附件与来源详情<i data-lucide="paperclip"></i></button><button id="copy" class="row-link">复制资料地址<i data-lucide="copy"></i></button></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
