<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>记录 · 灵藏</title><link rel="stylesheet" href="capture.css"></head><body>
<div class="app"><main><header class="topbar"><div><img src="brand.png" class="mobile-brand" alt=""><strong id="page-title">记录</strong></div><button id="connect" class="connection"><i></i><span id="connection-label">本机记录</span></button></header>
<section id="record-screen" class="screen"><div class="capture-space"><div class="welcome"><h1>此刻，想记下什么？</h1></div><form id="composer" class="composer"><div id="attachments" class="attachments"></div><label class="sr-only" for="record-text">记录内容</label><textarea id="record-text" placeholder="写下想法，或添加照片、录音…" rows="3"></textarea><div id="recording-bar" class="recording-bar" hidden><span class="recording-dot"></span><strong>正在录音</strong><span id="recording-time">00:00</span><button id="finish-recording" type="button">结束</button></div><div class="composer-bottom"><div class="tools"><button id="add-content" type="button" class="icon-button" aria-label="添加内容">＋</button><button id="voice" type="button" class="tool-button">语音</button><button id="camera" type="button" class="tool-button">拍照</button></div><button id="send" type="submit" class="send-button" aria-label="发送到收件箱" disabled>↑</button></div><div id="add-menu" class="add-menu" hidden><button id="pick-photos" type="button">选择图片</button><button id="pick-audio" type="button">添加音频</button></div></form><span id="draft-status" class="sr-only" role="status"></span><div class="recent"><div class="section-heading"><h2>最近记录</h2><button data-page="inbox">查看收件箱 ↗</button></div><div id="recent-list"></div></div></div></section>
<section id="inbox-screen" class="screen" hidden><div class="page-content"><div class="page-heading"><h1>收件箱</h1><button data-page="record" class="primary">新记录</button></div><div class="filters"><button data-filter="all" class="selected">全部</button><button data-filter="unprocessed">未加工</button><button data-filter="review">待确认</button><button data-filter="pending">待同步</button><button id="refresh">刷新</button></div><p id="inbox-notice" class="note"></p><div id="inbox-list"></div></div></section>
<section id="detail-screen" class="screen" hidden><div class="page-content detail"><button data-page="inbox" class="back-button">‹ 收件箱</button><div class="detail-heading"><span id="detail-date" class="eyebrow"></span><span id="detail-state" class="status"></span></div><h1 id="detail-title"></h1><div id="detail-body" class="original"></div><div id="detail-media" class="detail-media"></div><div class="detail-actions"><button id="edit-record">继续补充</button><button id="retry-sync">重试同步</button><button id="resolve-conflict" hidden>保留本机内容并基于最新版本重发</button><button id="process" class="primary">交给 Agent 加工 ↗</button></div><p id="detail-error" class="note" role="status"></p><div id="result-section"></div></div></section>
<nav class="mobile-nav" aria-label="导航"><button data-page="record" class="nav-button active">记录</button><button data-page="inbox" class="nav-button">收件箱</button><button data-native="library" class="nav-button">资料库</button><button data-native="tasks" class="nav-button">任务</button><button data-native="settings" class="nav-button">设置</button></nav>
</main></div>
<dialog id="process-dialog"><form id="process-form"><div class="dialog-header"><div><h2>交给 Agent 加工</h2></div><button type="button" class="close-dialog icon-button" aria-label="关闭">×</button></div><fieldset class="presets"><legend class="sr-only">加工方式</legend><label><input type="radio" name="preset" value="summary" checked><strong>整理摘要</strong></label><label><input type="radio" name="preset" value="extract"><strong>转写 / 识字</strong></label><label><input type="radio" name="preset" value="actions"><strong>提炼行动项</strong></label><label><input type="radio" name="preset" value="custom"><strong>自定义</strong></label></fieldset><label class="field">补充要求<textarea id="instructions" rows="3" placeholder="例如：保留原意，整理成简短笔记。"></textarea></label><div class="dispatch-fields"><label class="field">执行电脑<select id="dispatch-device"><option value="">自动选择可用电脑</option></select></label><label class="field">Agent<select id="dispatch-agent"><option value="">自动</option><option value="codex">Codex</option><option value="codebuddy">CodeBuddy</option></select></label></div><p id="process-error" class="note" role="alert"></p><button id="start-process" type="submit" class="primary full-width">开始加工</button></form></dialog>
<dialog id="camera-dialog"><div class="dialog-header"><h2>拍照</h2><button class="close-dialog icon-button" aria-label="关闭">×</button></div><video id="camera-preview" autoplay playsinline muted></video><button id="take-photo" class="primary full-width">拍下并添加</button></dialog>
<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden><input id="audio-input" type="file" accept="audio/*" multiple hidden><div id="toast" class="toast" role="status" hidden></div>
<script src="bridge.js"></script><script src="store.js"></script><script src="capture.js"></script></body></html>
