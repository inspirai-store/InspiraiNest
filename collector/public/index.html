<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>资料库 · 灵藏</title>
  <link rel="icon" type="image/png" href="/brand-icon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/library-frame.css">
  <link rel="stylesheet" href="/client-prompt.css">
  <script defer src="/client-prompt.js"></script>
  <script defer src="/device-identity.js"></script>
  <script defer src="/browser-session.js"></script><script defer src="/device-view.js"></script>
  <script defer src="/web-login.js"></script>
  <script defer src="/vendor/lucide.js"></script><script defer src="/vendor/marked.js"></script><script defer src="/vendor/purify.js"></script><script defer src="/app.js"></script>
<link rel="stylesheet" href="/pairing-dialog.css"></head>
<body>
  <section id="login-view">
    <form id="login-form" class="login-form">
      <div class="brand"><img src="/brand-icon.png" alt=""><span>灵藏</span></div>
      <h1>连接资料库</h1>
      <label>管理密钥或配对码<input name="key" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit"><i data-lucide="key-round"></i>登录</button>
      <p id="login-error" role="alert"></p>
      <a class="client-login-link" href="/download">下载客户端 <span aria-hidden="true">↗</span></a>
      <a class="client-login-link" href="/authorize">CLI 只读授权 <span aria-hidden="true">↗</span></a>
    </form>
  </section>
  <div id="app" hidden>
    <header class="workspace-header"><div class="header-start"><div class="brand"><img src="/brand-icon.png" alt=""><span>灵藏</span></div><button id="tasks-toggle" data-view="tasks" class="icon task-toggle" title="采集任务" aria-label="采集任务" aria-haspopup="dialog" aria-controls="tasks-dialog" aria-expanded="false"><i data-lucide="inbox"></i><span id="task-count" class="task-count" aria-hidden="true">0</span></button></div><span id="connection" role="status">连接中</span><a class="client-header-link" href="/download" title="下载客户端" aria-label="下载客户端"><i data-lucide="download"></i><span>下载客户端</span></a><button id="refresh" class="icon" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button><button id="logout" class="icon" title="退出登录" aria-label="退出登录"><i data-lucide="log-out"></i></button></header>
    <div class="layout">
      <nav aria-label="工作区"><button data-view="archives" aria-current="page"><i data-lucide="files"></i>资料库<span id="archive-count"></span></button><button data-view="devices"><i data-lucide="monitor-smartphone"></i>授权设备<span id="device-count"></span></button><a class="security-nav-link" href="/security"><i data-lucide="shield-check"></i>账户安全</a></nav>
      <main>
        <section id="archives-view"><div class="heading"><h1>资料库</h1><label class="search"><i data-lucide="search"></i><input id="search" type="search" aria-label="搜索资料" placeholder="搜索标题、摘要、标签"></label></div><div id="archives" class="rows"></div></section>
        <section id="devices-view" hidden><div class="heading"><h1>授权设备</h1><button id="pair-device" class="primary"><i data-lucide="link"></i>配对设备</button></div><div id="devices" class="rows"></div></section>
      </main>
    </div>
    <footer class="workspace-footer"><button id="worker-nodes-toggle" title="查看工作节点" aria-label="查看工作节点" aria-haspopup="dialog" aria-controls="worker-nodes-dialog" aria-expanded="false"><i data-lucide="network"></i><span>工作节点</span><strong id="worker-node-count">0/0</strong><i class="node-chevron" data-lucide="chevron-up"></i></button></footer>
  </div>
  <dialog id="worker-nodes-dialog" aria-labelledby="worker-nodes-title"><div class="dialog-heading"><h2 id="worker-nodes-title">工作节点</h2><button id="manage-worker-nodes"><i data-lucide="settings-2"></i>授权设备</button><button class="icon" data-close title="关闭工作节点" aria-label="关闭工作节点" autofocus><i data-lucide="x"></i></button></div><div class="node-map"><div class="node-hub"><span class="node-hub-symbol"><i data-lucide="library"></i></span><div><strong>灵藏资料库</strong><p id="node-connection-state">已连接</p></div><span id="node-connection-summary"></span></div><div id="worker-nodes" class="node-grid"></div></div></dialog>
  <dialog id="tasks-dialog" class="task-overlay" aria-labelledby="tasks-title"><div class="dialog-heading"><h2 id="tasks-title">采集任务</h2><button id="new-task" class="primary"><i data-lucide="plus"></i>采集资料</button><button class="icon" data-close title="关闭采集任务" aria-label="关闭采集任务" autofocus><i data-lucide="x"></i></button></div><section id="tasks-view" class="task-overlay-body"><div class="filter-bar"><label>状态<select id="status-filter"><option value="all">全部</option><option value="queued">待分配</option><option value="running">处理中</option><option value="waiting_action">待操作</option><option value="awaiting_review">待确认</option><option value="completed">已完成</option><option value="failed">失败</option><option value="cancelled">已取消</option></select></label><span id="queue-summary"></span></div><div id="tasks" class="rows"></div></section></dialog>
  <dialog id="task-dialog"><div class="dialog-heading"><h2>采集资料</h2><button class="icon" data-close title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><form id="task-form"><label>采集内容<textarea name="content" rows="6" required maxlength="10000" placeholder="分享内容、链接及采集要求"></textarea></label><label class="check-label"><input name="autoArchive" type="checkbox" checked>自动归档</label><label>标签<input name="tags" maxlength="1200" placeholder="可选，逗号分隔"></label><fieldset class="dispatch"><legend>派发</legend><div class="form-grid"><label>电脑<select name="deviceId" id="dispatch-device"><option value="">自动</option></select></label><label>Agent<select name="agent"><option value="">自动</option><option value="codex">Codex</option><option value="codebuddy">CodeBuddy</option></select></label></div></fieldset><p id="task-error" role="alert"></p><div class="actions"><button type="button" data-close>取消</button><button class="primary" type="submit"><i data-lucide="send"></i>提交任务</button></div></form></dialog>
  <dialog id="detail-dialog"><div class="dialog-heading"><h2>任务详情</h2><button class="icon" data-close title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="task-detail"></div></dialog>
  <dialog id="pair-dialog" class="pairing-dialog" aria-labelledby="pair-title"><div class="pairing-heading"><h2 id="pair-title">配对设备</h2><button type="button" class="pairing-icon" data-close aria-label="关闭配对窗口"><i data-lucide="x"></i></button></div><form id="pair-form" class="pairing-body"><p id="pair-status" role="status" hidden></p><div id="pair-result" hidden><div id="pair-qr-wrap" hidden><img id="pair-qr" alt="设备配对二维码" width="196" height="196"></div><div class="pairing-key-field"><label class="pairing-key-label" for="pair-key">配对码</label><div class="pairing-code"><input id="pair-key" readonly type="password" aria-label="一次性配对码" autocomplete="off"><button id="copy-key" type="button" class="pairing-icon" title="复制配对码" aria-label="复制配对码"><i data-lucide="copy"></i></button></div></div></div><p id="pair-error" role="alert" hidden></p><div class="pairing-footer"><span id="pair-expiry" role="status"></span><button id="pair-generate" type="submit" class="primary">生成配对码</button></div></form></dialog>
  <dialog id="reader"><div class="dialog-heading"><h2 id="reader-title"></h2><button id="download" class="icon" title="下载归档包" aria-label="下载归档包"><i data-lucide="download"></i></button><button class="icon" data-close title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div class="reader-body"><p id="reader-meta"></p><label>文档<select id="document-picker"></select></label><article id="document" class="markdown"></article><h3>附件</h3><div id="attachments"></div></div></dialog>
  <div id="notice" role="status" hidden></div>
</body>
</html>
