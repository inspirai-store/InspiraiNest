appId: store.inspirai.library.worker
productName: InspiraiNest
asar: false
directories:
  output: desktop/dist
files:
  - package.json
  - LICENSE
  - desktop/main.mjs
  - desktop/manager.mjs
  - desktop/execution-environment.mjs
  - desktop/owner-client.mjs
  - desktop/updater.mjs
  - desktop/settings.mjs
  - desktop/login-item.mjs
  - desktop/worker-session.mjs
  - desktop/settings-renderer.js
  - desktop/nodes.js
  - desktop/macos-policy.mjs
  - desktop/preload.cjs
  - desktop/renderer.js
  - desktop/index.html
  - desktop/style.css
  - desktop/workspace.css
  - desktop/workspace.js
  - desktop/client-login.js
  - desktop/pair.css
  - desktop/brand.css
  - desktop/icon.png
  - desktop/tray.png
  - desktop/trayTemplate.png
  - desktop/trayTemplate@2x.png
  - desktop/vendor/**
  - public/device-view.js
  - public/pairing-dialog.css
  - public/skill-manager.js
  - public/skill-manager.css
  - public/skill-market.js
  - public/skill-market.css
  - src/**
  - worker.production.example.json
  - node_modules/**
extraResources:
  - from: desktop/template
    to: library
win:
  icon: desktop/icon.ico
  target: nsis
  artifactName: InspiraiNest-v${version}-Windows-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
mac:
  icon: desktop/icon.png
  target:
    - zip
    - dmg
  artifactName: InspiraiNest-v${version}-macOS-${arch}.${ext}
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  notarize: true
  publish:
    provider: generic
    url: https://library.inspirai.store/updates/macos
    useMultipleRangeRequest: false
publish:
  provider: github
  owner: inspirai-store
  repo: InspiraiNest
