appId: store.inspirai.library.worker
productName: InspiraiNest
asar: false
directories:
  output: desktop/dist
files:
  - package.json
  - LICENSE
  - desktop/main.mjs
  - desktop/manager.mjs
  - desktop/updater.mjs
  - desktop/preload.cjs
  - desktop/renderer.js
  - desktop/index.html
  - desktop/style.css
  - desktop/pair.css
  - desktop/brand.css
  - desktop/icon.png
  - desktop/tray.png
  - src/**
  - worker.production.example.json
  - node_modules/**
extraResources:
  - from: desktop/template
    to: library
win:
  icon: desktop/icon.ico
  target: nsis
  artifactName: InspiraiNest-v${version}-Windows-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
mac:
  icon: desktop/icon.png
  target:
    - zip
    - dmg
  artifactName: InspiraiNest-v${version}-macOS-${arch}.${ext}
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  notarize: true
publish:
  provider: github
  owner: inspirai-store
  repo: InspiraiNest
